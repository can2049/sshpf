name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting + lint on Linux only. Running this once instead of
  # per-OS keeps the queue short; the OS matrix below focuses on compiling and
  # testing.
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Unit tests only: the e2e suite needs a real sshd, which is covered by
      # the dedicated job below. Running `--lib` here keeps the Windows job
      # meaningful instead of skipping everything.
      - name: Unit tests
        run: cargo test --lib

      - name: Build (release)
        run: cargo build --release

      # Upload the Windows binary so the port can be tried without a toolchain.
      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-windows-x86_64
          path: target/release/sshpf.exe
          if-no-files-found: error

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-linux-x86_64
          path: target/release/sshpf
          if-no-files-found: error

  # The end-to-end test starts a throw-away sshd on loopback. It is `#[ignore]`d
  # by default because it needs a working OpenSSH server and a usable key, so it
  # runs explicitly here to keep the real forwarding path covered.
  e2e:
    name: End-to-end (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Prepare a key for the temp sshd
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -q -t rsa -b 2048 -f ~/.ssh/id_rsa -N ''
          chmod 600 ~/.ssh/id_rsa

      - name: Run e2e
        run: cargo test --test e2e -- --ignored --test-threads=1
