name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting + lint on Linux only. Running this once instead of
  # per-OS keeps the queue short; the OS matrix below focuses on compiling and
  # testing.
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Unit tests only: the e2e suite needs a real sshd, which is covered by
      # the dedicated job below. Running `--lib` here keeps the Windows job
      # meaningful instead of skipping everything.
      #
      # Both platforms now run the *same* code path: the SSH client is pure Rust
      # (russh), so Windows needs no OpenSSH installed. The `ring` crypto backend
      # is selected in Cargo.toml precisely so this job needs nothing beyond the
      # preinstalled MSVC toolchain (the default `aws-lc-rs` backend would also
      # require NASM and CMake).
      - name: Unit tests
        run: cargo test --lib

      # Help-coverage test. It only reads source files and compares them against
      # `src/help.rs`, so it needs no service and runs on every OS in the matrix —
      # which is the point: "every dispatched key is documented" is a property of
      # the source, not of the platform.
      #
      # `cargo test --lib` above only compiles the library's own `#[cfg(test)]`
      # modules, so a `tests/*.rs` target is not executed by it. Without this step
      # the whole guarantee of the in-app help would sit in a file CI never runs.
      #
      # `tests/logging.rs` and `tests/panic_hardening.rs` are *not* listed here:
      # they drive the real binary and must not overlap, so they run in the
      # dedicated `hardening` job below (`--test-threads=1`). `tests/e2e.rs` needs
      # a real `sshd` and likewise has its own job.
      - name: Help coverage
        run: cargo test --test help_coverage

      - name: Build (release)
        run: cargo build --release

      # Upload the Windows binary so the port can be tried without a toolchain.
      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-windows-x86_64
          path: target/release/sshpf.exe
          if-no-files-found: error

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-linux-x86_64
          path: target/release/sshpf
          if-no-files-found: error

  # The crash-path and input-hardening suites run the **real binary** (and one of
  # them deliberately kills a child with SIGSEGV), which needs a Unix process
  # model. They were previously not wired into CI at all — `--lib` skips
  # `tests/*.rs`, so a regression in the panic hook or in the signal handler
  # could only be found by hand. User-supplied input (a hand-edited ssh config or
  # state file) is exactly what these cover, so they are a required check now.
  hardening:
    name: Panic hardening (real binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # `--test-threads=1`: the crash tests fork deliberate aborters and assert on
      # per-process env (`SSHPF_LOG_DIR`), so they must not overlap.
      - name: Crash-path and log tests
        run: cargo test --test logging -- --test-threads=1

      - name: Input hardening (hostile ssh config / config.toml)
        run: cargo test --test panic_hardening -- --test-threads=1

  # The end-to-end test starts a throw-away sshd on loopback. It is `#[ignore]`d
  # by default because it needs a working OpenSSH server and a usable key, so it
  # runs explicitly here to keep the real forwarding path covered.
  e2e:
    name: End-to-end (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Each test generates its own throw-away host/user key pair inside a
      # temp dir, so there is nothing to prepare here.
      - name: Run e2e
        run: cargo test --test e2e -- --ignored --test-threads=1
