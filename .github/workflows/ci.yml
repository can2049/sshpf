name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting + lint on Linux only. Running this once instead of
  # per-OS keeps the queue short; the OS matrix below focuses on compiling and
  # testing.
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Unit tests only: the e2e suite needs a real sshd, which is covered by
      # the dedicated job below. Running `--lib` here keeps the Windows job
      # meaningful instead of skipping everything.
      #
      # Both platforms now run the *same* code path: the SSH client is pure Rust
      # (russh), so Windows needs no OpenSSH installed. The `ring` crypto backend
      # is selected in Cargo.toml precisely so this job needs nothing beyond the
      # preinstalled MSVC toolchain (the default `aws-lc-rs` backend would also
      # require NASM and CMake).
      - name: Unit tests
        run: cargo test --lib

      # Integration tests that need no external service. `cargo test --lib`
      # above compiles and runs the library's own `#[cfg(test)]` modules only,
      # so `--tests`-style targets were previously never executed by CI at all —
      # `tests/logging.rs` had been silently unrun since it was added, and the
      # help-coverage test would have joined it.
      #
      # Both are pure-Rust and platform-guarded where they are not (the logging
      # suite wraps its permission and signal assertions in `#[cfg(unix)]`), so
      # they run on every OS in the matrix rather than being Linux-only.
      # `tests/e2e.rs` is excluded on purpose: it needs a real `sshd` and has its
      # own job below (it is `#[ignore]`d, so it would otherwise pass trivially
      # here while covering nothing).
      - name: Integration tests
        run: cargo test --test help_coverage --test logging

      - name: Build (release)
        run: cargo build --release

      # Upload the Windows binary so the port can be tried without a toolchain.
      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-windows-x86_64
          path: target/release/sshpf.exe
          if-no-files-found: error

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sshpf-linux-x86_64
          path: target/release/sshpf
          if-no-files-found: error

  # The end-to-end test starts a throw-away sshd on loopback. It is `#[ignore]`d
  # by default because it needs a working OpenSSH server and a usable key, so it
  # runs explicitly here to keep the real forwarding path covered.
  e2e:
    name: End-to-end (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Each test generates its own throw-away host/user key pair inside a
      # temp dir, so there is nothing to prepare here.
      - name: Run e2e
        run: cargo test --test e2e -- --ignored --test-threads=1
