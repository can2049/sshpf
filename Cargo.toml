[package]
name = "sshpf"
version = "0.1.0"
edition = "2024"
description = "SSH port forward manager with a TUI dashboard (Linux first)"
license = "MIT"
repository = "https://github.com/can2049/sshpf"
homepage = "https://github.com/can2049/sshpf"
readme = "README.md"
keywords = ["ssh", "port-forwarding", "tui", "tunnel", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "sshpf"
path = "src/main.rs"

[lib]
name = "sshpf"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dirs = "7"
hmac = "0.13"
libc = "0.2"
ratatui = "0.30"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
signal-hook = "0.4"
ssh2-config = "=0.9.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
