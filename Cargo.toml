[package]
name = "sshpf"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "SSH port forward manager with a TUI dashboard (-L / -R / -D)"
license = "MIT"
repository = "https://github.com/can2049/sshpf"
homepage = "https://github.com/can2049/sshpf"
readme = "README.md"
keywords = ["ssh", "port-forwarding", "tui", "tunnel", "cli"]
categories = ["command-line-utilities"]
# Keep the published tarball to what a user of the crate actually needs.
# `docs/research/` is development history (and contains scratch test fixtures),
# `.github/` is CI-only, `rustfmt.toml` is not needed at build time. All of it
# stays in the git repo — this only trims the crates.io download.
exclude = ["docs/research/**", ".github/**", "rustfmt.toml"]

[[bin]]
name = "sshpf"
path = "src/main.rs"

[lib]
name = "sshpf"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dirs = "7"
hmac = "0.13"
libc = "0.2"
ratatui = "0.30"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
signal-hook = "0.4"
ssh2-config = "=0.9.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
