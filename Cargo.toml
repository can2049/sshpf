[package]
name = "sshpf"
version = "0.1.0"
edition = "2024"
description = "SSH port forward manager with a TUI dashboard (Linux first)"
license = "MIT"
repository = "https://github.com/can2049/sshpf"
homepage = "https://github.com/can2049/sshpf"
readme = "README.md"
keywords = ["ssh", "port-forwarding", "tui", "tunnel", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "sshpf"
path = "src/main.rs"

[lib]
name = "sshpf"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dirs = "7"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = "1"

[target.'cfg(windows)'.dependencies]
# Job Objects give Windows the equivalent of a Unix process group plus
# PR_SET_PDEATHSIG: closing the job handle kills the whole child tree.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
