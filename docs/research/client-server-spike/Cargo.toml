[package]
name = "sshpf-cs-spike"
version = "0.1.0"
edition = "2021"
description = "Throwaway prototype proving the client-server design of sshpf: singleton election, snapshot broadcast, last-client-exit lifecycle."

# Every assertion in README.md comes from running this crate. It is a measuring
# instrument, not a product: the repo's root Cargo.toml excludes docs/research/**,
# so nothing here is built by `cargo build` at the top level.
#
# Dependencies are deliberately only what the real crate already uses (serde +
# toml). The design forbids adding dependencies, so the codec must be provable
# with those two; std covers the rest (UnixListener, File::try_lock, mpsc).
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

[[bin]]
name = "election"
path = "src/election.rs"

[[bin]]
name = "broadcast"
path = "src/broadcast.rs"

[[bin]]
name = "lifecycle"
path = "src/lifecycle.rs"

[[bin]]
name = "codec"
path = "src/codec.rs"

[[bin]]
name = "e2e"
path = "src/e2e.rs"

[[bin]]
name = "clock"
path = "src/clock.rs"
