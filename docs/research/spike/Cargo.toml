# Reproduces every measurement in ../pure-rust-ssh-spike.md.
#
#   mkdir -p ~/spike && cp -r docs/research/spike/* ~/spike/ && cd ~/spike
#   ./sshd/run.sh                       # starts a throwaway sshd on 127.0.0.1:22200
#   cargo run --bin spike               # -L / -R / -D via russh
#   cargo run --bin proxyjump           # ProxyJump by nesting SSH in a channel
#   cargo run --bin lifecycle           # teardown, fd leaks, restart storms
#   cargo run --bin errpaths            # typed error surface vs stderr parsing
#   cargo run --bin throughput          # RTT + bulk MiB/s
#   cargo run --bin keys                # key format coverage
[package]
name = "sshpf-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spike"
path = "forward-spike.rs"

[[bin]]
name = "config-parse"
path = "config-parse-spike.rs"

[dependencies]
anyhow = "1"
# ring backend: no cmake, no NASM (crate ships precompiled objects)
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
ssh2-config = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[profile.release]
strip = true
lto = "thin"
